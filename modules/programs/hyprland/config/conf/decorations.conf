# https://wiki.hyprland.org/Configuring/Variables/#decoration

decoration {
    rounding = 4
    blur {
        enabled = true
        size = 20
        passes = 2
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }
    active_opacity = 0.85
    inactive_opacity = 0.80
    fullscreen_opacity = 1.0

    drop_shadow = true
    shadow_range = 30
    shadow_render_power = 3
    col.shadow = 0x66000000
}

blurls = waybar
